<!doctype html><html><head><meta charset="utf-8"><title>Colors — Green scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--li-bg);font-family:var(--li-font-sans);padding:20px;box-sizing:border-box}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border-radius:12px;overflow:hidden;border:1px solid var(--li-border);background:#fff}
.ch{height:70px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px;font-weight:600}
.meta{padding:10px 12px;font-size:12px;display:flex;justify-content:space-between}
.name{font-weight:600}
.hex{color:var(--li-fg-3);font-family:var(--li-font-mono);font-size:11px}
.use{font-size:11px;color:var(--li-fg-3);padding:0 12px 10px}
</style></head>
<body class="li-body">
<div class="row">
  <div class="sw"><div class="ch" style="background:#D6FBE1;color:#0A0A0A">soft</div><div class="meta"><span class="name">Green soft</span><span class="hex">#D6FBE1</span></div><div class="use">Banners "12 cuotas"</div></div>
  <div class="sw"><div class="ch" style="background:#00E64D;color:#0A0A0A">primary</div><div class="meta"><span class="name">Green</span><span class="hex">#00E64D</span></div><div class="use">CTAs, power, badges</div></div>
  <div class="sw"><div class="ch" style="background:#00C944">hover</div><div class="meta"><span class="name">Green hover</span><span class="hex">#00C944</span></div><div class="use">Hover CTA</div></div>
  <div class="sw"><div class="ch" style="background:#00A63A">press / text</div><div class="meta"><span class="name">Green press</span><span class="hex">#00A63A</span></div><div class="use">Press + texto AA sobre blanco</div></div>
</div>
</body></html>
