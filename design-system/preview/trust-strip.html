<!doctype html><html><head><meta charset="utf-8"><title>Trust strip</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--li-bg);padding:22px;box-sizing:border-box}
.strip{background:#fff;border:1px solid var(--li-border);border-radius:16px;padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.item{display:flex;gap:12px;align-items:flex-start}
.ic{width:36px;height:36px;border-radius:10px;background:var(--li-black);color:var(--li-green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:20px;height:20px}
.t{font-size:13px;font-weight:600;color:var(--li-fg-1);line-height:1.3}
.s{font-size:11px;color:var(--li-fg-3);line-height:1.4;margin-top:2px}
</style></head>
<body class="li-body">
<div class="strip">
  <div class="item">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4z"/><path d="m9 12 2 2 4-4"/></svg></div>
    <div><div class="t">Garantía Lucas</div><div class="s">Reclamás en el local, no a Capital.</div></div>
  </div>
  <div class="item">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1" y="7" width="15" height="10" rx="1"/><path d="M16 10h3l3 3v4h-6"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></div>
    <div><div class="t">Envío rápido</div><div class="s">Villa Santa Rosa y zona en 24 hs.</div></div>
  </div>
  <div class="item">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div>
    <div><div class="t">12 cuotas sin interés</div><div class="s">Mercado Pago · Naranja · Cuota Simple</div></div>
  </div>
  <div class="item">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg></div>
    <div><div class="t">WhatsApp humano</div><div class="s">Te atendemos nosotros, sin bot.</div></div>
  </div>
</div>
</body></html>
