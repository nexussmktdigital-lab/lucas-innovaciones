<!doctype html><html><head><meta charset="utf-8"><title>Colors — Core</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--li-bg);font-family:var(--li-font-sans);padding:20px;box-sizing:border-box}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sw{border-radius:12px;overflow:hidden;border:1px solid var(--li-border);background:#fff}
.ch{height:88px}
.meta{padding:10px 12px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.name{font-weight:600;color:var(--li-fg-1)}
.hex{color:var(--li-fg-3);font-family:var(--li-font-mono);font-size:11px}
</style></head>
<body class="li-body">
<div class="row">
  <div class="sw"><div class="ch" style="background:#0A0A0A"></div><div class="meta"><span class="name">Black</span><span class="hex">#0A0A0A</span></div></div>
  <div class="sw"><div class="ch" style="background:#00E64D"></div><div class="meta"><span class="name">Green</span><span class="hex">#00E64D</span></div></div>
  <div class="sw"><div class="ch" style="background:#F4F4F4;border-bottom:1px solid var(--li-border)"></div><div class="meta"><span class="name">BG grey</span><span class="hex">#F4F4F4</span></div></div>
  <div class="sw"><div class="ch" style="background:#FFFFFF;border-bottom:1px solid var(--li-border)"></div><div class="meta"><span class="name">White</span><span class="hex">#FFFFFF</span></div></div>
  <div class="sw"><div class="ch" style="background:#6B6B6B"></div><div class="meta"><span class="name">Text mute</span><span class="hex">#6B6B6B</span></div></div>
</div>
</body></html>
