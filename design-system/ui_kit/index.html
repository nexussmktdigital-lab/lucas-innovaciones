<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lucas Innovaciones — Tienda</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--li-bg); }
  </style>
</head>
<body class="li-body">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="ProductCard.jsx"></script>
  <script type="text/babel" src="Home.jsx"></script>
  <script type="text/babel" src="Product.jsx"></script>
  <script type="text/babel" src="Checkout.jsx"></script>

  <script type="text/babel" data-presets="react">
    const { useState } = React;

    function App() {
      const [route, setRoute] = useState("home"); // home | product | checkout
      const [product, setProduct] = useState(null);

      const openProduct = (p) => { setProduct(p || CATALOG[0]); setRoute("product"); window.scrollTo(0,0); };
      const go = (r) => { setRoute(r); window.scrollTo(0,0); };

      return (
        <>
          <Header current={route} onNav={go} cartCount={route === "checkout" ? 1 : 2}/>
          {route === "home" && <Home onOpenProduct={openProduct} onCheckout={() => go("checkout")}/>}
          {route === "product" && <Product p={product || CATALOG[0]} onBack={() => go("home")} onOpenProduct={openProduct} onCheckout={() => go("checkout")}/>}
          {route === "checkout" && <Checkout onBack={() => go("home")}/>}
          <Footer/>
          <WhatsappFab/>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
