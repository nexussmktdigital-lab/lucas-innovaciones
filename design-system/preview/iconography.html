<!doctype html><html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--li-bg);padding:20px;box-sizing:border-box}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--li-fg-3);margin:0 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-bottom:16px}
.ic{aspect-ratio:1;background:#fff;border:1px solid var(--li-border);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--li-fg-1)}
.ic svg{width:22px;height:22px}
.pixel-row{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--li-border);border-radius:12px;padding:14px}
.pixel-row img{width:44px;height:44px;image-rendering:pixelated}
.pixel-row .d{font-size:12px;color:var(--li-fg-3)}
.pixel-row .d b{color:var(--li-fg-1);display:block;font-size:13px}
</style></head>
<body class="li-body">
<h3>Lucide · 1.75px stroke</h3>
<div class="grid">
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="1" y="7" width="15" height="10" rx="1"/><path d="M16 10h3l3 3v4h-6"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4z"/><path d="m9 12 2 2 4-4"/></svg></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
</div>
<div class="pixel-row">
  <img src="../assets/cursor-pixel.svg" alt="">
  <div class="d"><b>Pixel cursor · firma de la marca</b>Solo en WhatsApp FAB, loader y acentos del hero. No usar como icono utilitario.</div>
</div>
</body></html>
