<!doctype html><html><head><meta charset="utf-8"><title>Type — Price</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--li-bg);padding:24px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:1px solid var(--li-border);border-radius:16px;padding:20px}
.eyebrow{font-size:11px;color:var(--li-fg-3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;font-weight:600}
</style></head>
<body class="li-body">
<div class="card">
  <div class="eyebrow">Precio standard</div>
  <div class="li-price-contado">$ 1.299.000</div>
  <div class="li-price-cuotas" style="margin-top:6px">o <b>12 cuotas sin interés</b> de $ 108.250</div>
  <div class="li-small" style="margin-top:4px">IVA incluido</div>
</div>
<div class="card">
  <div class="eyebrow">Con descuento</div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="li-price-tachado">$ 1.499.000</span>
    <span class="li-pixel" style="background:var(--li-green);color:var(--li-black);padding:2px 8px;border-radius:4px;font-size:14px">−13%</span>
  </div>
  <div class="li-price-contado" style="margin-top:4px">$ 1.299.000</div>
  <div class="li-price-cuotas" style="margin-top:6px">o <b>12 cuotas sin interés</b> de $ 108.250</div>
</div>
</body></html>
